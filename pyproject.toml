[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsc-legalqa"
version = "1.0.0"
description = "Grounded Vietnamese Legal Question Answering System for UIT Data Science Challenge 2026 Task 2"
readme = "README.md"
authors = [{ name = "Chef221" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "sentence-transformers>=2.7.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "nltk>=3.8.1",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["gpu: marks tests as requiring GPU"]

